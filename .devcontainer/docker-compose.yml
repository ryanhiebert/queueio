services:
  dev:
    image: mcr.microsoft.com/devcontainers/python
    volumes:
      - ../..:/workspaces
    command: sleep infinity
  rabbitmq:
    image: rabbitmq:management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit permit_deprecated_features #{global_qos=>true}"
    ports:
      - 127.0.0.1:5672:5672
      - 15672:15672
